name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Build and package
        shell: pwsh
        run: ./tools/build-release.ps1
      - name: Upload installer and portable package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PrivateTimeTrace-win-x64
          path: |
            artifacts/releases/v*/*-Setup.exe
            artifacts/releases/v*/*.zip
            artifacts/releases/v*/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
